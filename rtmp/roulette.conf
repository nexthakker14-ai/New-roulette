# SRS RTMP ingest for the 777UA monitor.
# The stream key must be kept private; add publish authentication before
# exposing this endpoint to untrusted publishers.
listen              1935;
max_connections     20;

srs_log_tank        console;
srs_log_level       info;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

http_api {
    enabled         on;
    listen          1985;
}

vhost __defaultVhost__ {
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    3;
        hls_window      30;
        hls_cleanup     on;
    }
}
